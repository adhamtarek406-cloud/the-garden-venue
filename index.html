<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Garden Venue | New Cairo</title>
<meta name="description" content="The Garden Venue, New Cairo. Luxury outdoor weddings and events. Fully customizable setups, designed to match your vision.">
<meta name="theme-color" content="#17402F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&family=Marcellus&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/motion@11.11.13/dist/motion.js"></script>
<script>
  // Motion is progressive: without it (or with reduced motion) the page renders in its final state.
  if (window.Motion && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('mo');
</script>
<style>
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:#fff}
.gd{
  --palm:#17402F;--palm-d:#0F2C20;--velvet:#9B1C24;--velvet-d:#7A141B;--lantern:#E8A33D;
  --plaster:#E7ECE3;--ink:#12291F;--mute:#4E6358;--line:#C8D3C6;--line-d:rgba(255,255,255,.18);
  --ease:cubic-bezier(.22,1,.36,1);--snap:cubic-bezier(.34,1.25,.64,1);
  --t-xs:13px;--t-s:15px;--t-m:17px;--t-l:22px;--t-xl:clamp(26px,2.6vw,32px);
  --t-2xl:clamp(36px,4.4vw,56px);--t-3xl:clamp(44px,5.6vw,82px);
  background:#fff;color:var(--ink);font-size:var(--t-m);line-height:1.6;overflow-x:clip;-webkit-font-smoothing:antialiased
}
.gd *{box-sizing:border-box}
.gd.en{font-family:'Instrument Sans',system-ui,sans-serif}
.gd.ar{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;line-height:1.75}
.gd.en .disp,.gd.en .h1,.gd.en .h2,.gd.en .h3{font-family:'Marcellus',Georgia,serif;font-weight:400}
.gd.ar .disp,.gd.ar .h1,.gd.ar .h2,.gd.ar .h3{font-family:'Aref Ruqaa',serif;font-weight:700}
.gd button,.gd input,.gd select{font:inherit;color:inherit}
.gd button{cursor:pointer}
.gd a{color:inherit}
.gd :focus-visible{outline:2px solid var(--lantern);outline-offset:3px}
.gd img{max-width:100%}
.wrap{max-width:1200px;margin:0 auto;padding-inline:32px}
.h1{font-size:var(--t-3xl);line-height:1.02;margin:0;letter-spacing:-.01em}
.gd.ar .h1{line-height:1.3}
.h2{font-size:var(--t-2xl);line-height:1.08;margin:0}
.gd.ar .h2{line-height:1.4}
.h3{font-size:var(--t-xl);line-height:1.2;margin:0}
.lead{font-size:var(--t-m);color:var(--mute);max-width:58ch;margin:16px 0 0}
.note{font-size:var(--t-xs);color:var(--mute);margin:18px 0 0;max-width:72ch}
.sec{padding:112px 0}

/* buttons: square-ish corners on purpose; the arches carry the curves */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:6px;border:1.5px solid transparent;font-weight:600;font-size:var(--t-s);text-decoration:none;white-space:nowrap;transition:background-color .25s,color .25s,border-color .25s,transform .2s var(--ease)}
.btn:active{transform:translateY(1px)}
.btn-v{background:var(--velvet);color:#fff}
.btn-v:hover{background:var(--velvet-d)}
.btn-line{border-color:currentColor;background:transparent}
.btn-line:hover{background:color-mix(in srgb,currentColor 10%,transparent)}
.btn-amber{background:var(--lantern);color:var(--ink)}
.btn-amber:hover{background:#f2b558}
.btn-wa{background:#1d6e47;color:#fff}
.btn-wa:hover{background:#155636}
.btn svg{flex:none}

/* top bar */
.bar{position:sticky;top:0;z-index:60;background:var(--palm);color:#fff;border-bottom:1px solid var(--line-d)}
.bar-in{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:68px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand-n{font-family:'Marcellus',Georgia,serif;font-size:21px;line-height:1;letter-spacing:.02em;white-space:nowrap}
.brand-n small{display:block;font-size:12px;letter-spacing:.24em;opacity:.7;margin-top:4px}
.links{display:flex;gap:28px;font-size:var(--t-s)}
.links a{text-decoration:none;opacity:.85;padding:8px 0;border-bottom:1.5px solid transparent;transition:opacity .2s,border-color .2s}
.links a:hover{opacity:1;border-color:var(--lantern)}
.bar-end{display:flex;align-items:center;gap:14px}
.lang{display:flex;gap:2px}
.lang button{border:0;background:transparent;color:#fff;opacity:.6;min-width:44px;min-height:44px;padding:0 8px;font-size:var(--t-s);font-weight:600;border-bottom:2px solid transparent;transition:opacity .2s,border-color .3s var(--ease)}
.lang button.on{opacity:1;border-color:var(--lantern)}
.lang button:last-child{font-family:'IBM Plex Sans Arabic',sans-serif}
.bar .btn{min-height:42px;padding:0 18px}

/* hero */
.hero{background:var(--palm);color:#fff;position:relative;overflow:hidden}
.hero-in{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.75fr);gap:48px;align-items:end;padding-top:56px}
.hero-copy{padding-bottom:72px}
.bio-name{margin:0 0 22px;font-size:var(--t-s);color:#cfe0d4}
.h1 .ln{display:block;overflow:hidden;padding-bottom:.08em}
@media (min-width:1001px){.h1 .ln{white-space:nowrap}}
.h1 .ln>span{display:block}
.bio-lines{margin:28px 0 0;font-size:var(--t-l);line-height:1.45;color:#e9efe9}
.bio-lines span{display:block}
.bio-meta{list-style:none;margin:26px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:10px 28px;font-size:var(--t-s);color:#cfe0d4}
.bio-meta li{display:flex;align-items:center;gap:8px}
.bio-meta a{text-decoration:none}
.bio-meta a:hover{color:#fff;text-decoration:underline;text-underline-offset:4px}
.bio-meta svg{color:var(--lantern)}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
.arch{position:relative;overflow:hidden;border-radius:1000px 1000px 0 0;background:var(--palm-d);isolation:isolate}
.hero-arch{aspect-ratio:.7;width:100%;max-width:470px;justify-self:end;border:1px solid rgba(232,163,61,.35);border-bottom:0}
.arch-ph{position:absolute;inset:0}
.arch .ph{position:absolute;inset:-16% 0 -14%;width:100%;height:130%;object-fit:cover;display:block}
.hero-arch .ph{inset:-18% 0 -16%;height:134%;object-position:50% 70%}
.drape{display:none;position:absolute;top:0;bottom:0;width:50.5%;z-index:2;
  background:
    linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.3)),
    repeating-linear-gradient(90deg,#7d141b 0 16px,#a8242d 16px 30px,#8c1a21 30px 46px,#b02a33 46px 54px,#7d141b 54px 70px)}
.drape.l{left:0}
.drape.r{right:0}
.mo .drape{display:block}
.mo .hero .ln>span{transform:translateY(106%)}
.mo .hero [data-fade]{opacity:0}

/* date check */
.check{background:#fff;border-bottom:1px solid var(--line);padding:36px 0}
.check-in{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr) auto;gap:20px;align-items:end}
.check .h3{font-size:var(--t-l);align-self:center}
.gd.ar .check .h3{font-size:26px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:var(--t-xs);color:var(--mute);font-weight:500}
.inp{width:100%;min-height:48px;border-radius:6px;border:1.5px solid var(--line);background:#fff;padding:0 14px;font-size:var(--t-s);color:var(--ink)}
.inp:focus{border-color:var(--palm);outline:0}
.step{display:flex;align-items:center;justify-content:space-between;min-height:48px;border-radius:6px;border:1.5px solid var(--line);padding:0 4px}
.step button{width:40px;height:40px;border:0;border-radius:4px;background:transparent;font-size:20px;line-height:1}
.step button:hover{background:var(--plaster)}
.step b{font-weight:600;font-variant-numeric:tabular-nums}
.result{margin-top:18px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:16px 18px;border-radius:6px;background:var(--plaster);font-size:var(--t-s)}
.result b{font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:8px;vertical-align:middle}
.result small{display:block;color:var(--mute);font-size:var(--t-xs);margin-top:2px}

/* the day */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px;margin-top:56px}
.moment .arch{aspect-ratio:4/4.6}
.moment .when{margin:22px 0 4px;font-size:var(--t-s);color:var(--velvet);font-weight:600}
.moment p{margin:10px 0 0;color:var(--mute);max-width:52ch}
.moment .list{color:var(--ink)}
.inc-h{margin-top:96px}
.inc{list-style:none;padding:0;margin:28px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 48px;border-top:1px solid var(--line)}
.inc li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
.inc svg{color:var(--velvet);margin-top:3px}
.inc b{display:block;font-weight:600}
.inc span{display:block;color:var(--mute);font-size:var(--t-s)}

/* spaces */
.sp{background:var(--plaster);transition:background-color 1.1s var(--ease),color 1.1s var(--ease)}
.sp.night{background:var(--palm-d);color:#eef3ee}
.sp.night .lead,.sp.night .sp-info p{color:#b9cabe}
.sp-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:24px}
.sw{display:inline-flex;align-items:center;gap:12px;border:0;background:transparent;padding:6px 0;font-size:var(--t-s);font-weight:600}
.sw-t{opacity:.5;transition:opacity .4s}
.sw[aria-checked="false"] .sw-t:first-child,.sw[aria-checked="true"] .sw-t:last-child{opacity:1}
.sw-k{position:relative;width:64px;height:34px;border-radius:999px;background:var(--lantern);transition:background-color .6s var(--ease)}
.sw-k i{position:absolute;top:4px;inset-inline-start:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:inset-inline-start .45s var(--snap)}
.sp.night .sw-k{background:#2f4f8a}
.sp.night .sw-k i{inset-inline-start:34px}
.tabs{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);margin-top:44px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.sp.night .tabs,.food .tabs{border-color:var(--line-d)}
.tabs button{border:0;background:transparent;padding:14px 8px;text-align:start;font-size:var(--t-m);font-weight:500;opacity:.6;white-space:nowrap;transition:opacity .3s}
.tabs button.on{opacity:1}
.tabs i{position:absolute;bottom:-1px;height:2px;background:var(--velvet);transition:inset-inline-start .45s var(--snap),width .45s var(--snap)}
.sp.night .tabs i,.food .tabs i{background:var(--lantern)}
.sp-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:56px;margin-top:40px;align-items:start}
.scene{position:relative;aspect-ratio:4/3.2;border-radius:6px;overflow:hidden;isolation:isolate;background:#223}
.scene>.lay{position:absolute;inset:0;transition:opacity 1s var(--ease)}
.scene svg{width:100%;height:100%;display:block}
.scene .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.nightov{position:absolute;inset:0;background:#171c3d;mix-blend-mode:multiply;transition:opacity 1.2s var(--ease);pointer-events:none}
.tw{animation:none}
.sp-info h3{margin-bottom:12px}
.sp-info p{margin:0;color:var(--mute);min-height:5.2em}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:28px 0 0;border-top:1px solid currentColor;border-color:color-mix(in srgb,currentColor 22%,transparent)}
.specs div{padding:16px 0}
.specs dt{font-size:var(--t-xs);opacity:.7}
.specs dd{margin:2px 0 0;font-size:var(--t-xl);font-family:'Marcellus',Georgia,serif;font-variant-numeric:tabular-nums}
.amen{list-style:none;margin:8px 0 0;padding:0}
.amen li{display:flex;gap:12px;align-items:center;padding:9px 0;font-size:var(--t-s)}
.amen svg{flex:none;color:var(--velvet)}
.sp.night .amen svg{color:var(--lantern)}
.sp-info .btn{margin-top:24px}

/* packages */
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:56px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tier{display:flex;flex-direction:column;padding:32px 28px 30px;border-inline-start:1px solid var(--line);position:relative;transition:background-color .35s}
.tier:first-child{border-inline-start:0}
.tier::before{content:'';position:absolute;top:-1px;inset-inline:0;height:3px;background:var(--velvet);transform:scaleX(0);transition:transform .5s var(--ease)}
.tier.on{background:var(--plaster)}
.tier.on::before{transform:none}
.tier .h3{font-size:var(--t-xl)}
.price{margin:18px 0 0;font-size:var(--t-s);color:var(--mute)}
.price b{display:block;font-family:'Marcellus',Georgia,serif;font-weight:400;font-size:clamp(40px,4vw,52px);line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;margin-bottom:6px}
.min{margin:12px 0 0;font-size:var(--t-s);font-weight:600;color:var(--velvet)}
.tier ul{list-style:none;padding:0;margin:22px 0 28px;flex:1}
.tier li{padding:8px 0;font-size:var(--t-s);border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.tier .btn{align-self:flex-start}

.sim{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.9fr);gap:48px;margin-top:96px;align-items:start}
.sim .h3{margin-bottom:8px}
.ctl{margin-top:30px}
.lbl{display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-size:var(--t-s);font-weight:600}
.bignum{font-family:'Marcellus',Georgia,serif;font-weight:400;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.range{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:linear-gradient(90deg,var(--velvet) var(--p,40%),var(--line) var(--p,40%));margin:22px 0 8px;border-radius:2px}
.gd.ar .range{background:linear-gradient(270deg,var(--velvet) var(--p,40%),var(--line) var(--p,40%))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--velvet);cursor:grab}
.range::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--velvet);cursor:grab}
.minmax{display:flex;justify-content:space-between;font-size:var(--t-xs);color:var(--mute)}
.seg{position:relative;display:flex;margin-top:12px;border:1.5px solid var(--line);border-radius:6px;padding:3px}
.seg button{position:relative;z-index:1;flex:1;border:0;background:transparent;min-height:44px;border-radius:4px;font-size:var(--t-s);font-weight:500;padding:0 8px;line-height:1.25;transition:color .3s}
.seg button.on{color:#fff}
.seg i{position:absolute;top:3px;bottom:3px;border-radius:4px;background:var(--palm);transition:inset-inline-start .45s var(--snap)}
.adds{display:grid;gap:8px;margin-top:12px}
.add{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:start;width:100%;padding:14px 16px;border-radius:6px;border:1.5px solid var(--line);background:#fff;transition:border-color .25s,background-color .25s}
.add.on{border-color:var(--velvet);background:#fbf3f3}
.add .ck{width:22px;height:22px;border-radius:4px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;transition:all .25s}
.add.on .ck{background:var(--velvet);border-color:var(--velvet);color:#fff}
.add b{display:block;font-weight:600;font-size:var(--t-s)}
.add small{display:block;color:var(--mute);font-size:var(--t-xs);line-height:1.4}
.add em{font-style:normal;font-size:var(--t-xs);font-weight:600;color:var(--velvet);white-space:nowrap}
.rcpt{position:sticky;top:96px;background:var(--palm);color:#eef3ee;border-radius:6px;padding:32px}
.rcpt .lbl{color:#b9cabe;font-weight:500}
.total{font-family:'Marcellus',Georgia,serif;font-size:clamp(42px,4.6vw,60px);line-height:1.05;color:var(--lantern);margin-top:6px;font-variant-numeric:tabular-nums}
.total small{font-size:.38em;margin-inline-end:10px;color:#eef3ee}
.rcpt hr{border:0;border-top:1px solid var(--line-d);margin:20px 0}
.line{display:flex;justify-content:space-between;gap:16px;font-size:var(--t-s);padding:5px 0}
.line span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.rcpt .fine{font-size:var(--t-xs);color:#b9cabe;margin:0 0 10px}
.rcpt .btn{width:100%;margin-top:12px}

/* food */
.food{background:var(--palm);color:#eef3ee}
.food .lead,.food .menu-desc{color:#b9cabe}
.food-in{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:72px;align-items:center}
.menu-desc{margin:24px 0 0;min-height:3.2em}
.mlist{list-style:none;padding:0;margin:14px 0 32px;columns:2;column-gap:40px}
.mlist li{break-inside:avoid;padding:12px 0;border-bottom:1px solid var(--line-d)}
.food-arch{aspect-ratio:4/5.2;max-width:440px;justify-self:end;width:100%;border:1px solid rgba(232,163,61,.35);border-bottom:0}

/* weddings */
.we-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:transparent;min-height:42px;padding:0 16px;border-radius:6px;font-size:var(--t-s);font-weight:500;transition:all .25s}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.look{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:36px}
.tile{position:relative;margin:0;aspect-ratio:4/5;border-radius:6px;overflow:hidden;background:var(--plaster)}
.tile .ph{position:absolute;inset:-14% 0 -14%;width:100%;height:128%;object-fit:cover}
.tile figcaption{position:absolute;inset-inline:0;bottom:0;padding:40px 18px 16px;color:#fff;font-size:var(--t-s);font-weight:500;background:linear-gradient(0deg,rgba(10,25,18,.75),rgba(10,25,18,0))}
.note a{color:var(--velvet);font-weight:600}

/* visit */
.visit{background:var(--plaster)}
.visit-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px;align-items:start}
.visit ul{list-style:none;padding:0;margin:28px 0 0}
.visit li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.visit li svg{color:var(--velvet);flex:none}
.panel{background:#fff;border-radius:6px;padding:32px;border:1px solid var(--line)}
.panel .seg{margin-top:0}
.desc{font-size:var(--t-s);color:var(--mute);margin:14px 0 0;min-height:3.2em}
.stack{display:grid;gap:14px;margin-top:16px}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{border:1.5px solid var(--line);background:#fff;min-height:44px;padding:0 16px;border-radius:6px;font-size:var(--t-s);font-variant-numeric:tabular-nums;transition:all .2s}
.slot.on{background:var(--palm);border-color:var(--palm);color:#fff}
.err{font-size:var(--t-s);color:var(--velvet);margin:0}
.done{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:6px;background:#eef4ec;border:1px solid #bcd0b8}
.done p{margin:4px 0 0;font-size:var(--t-s);color:var(--mute)}

/* footer */
.foot{background:var(--palm-d);color:#cfe0d4;padding:72px 0 120px;font-size:var(--t-s)}
.foot-in{display:flex;flex-wrap:wrap;gap:40px;justify-content:space-between}
.foot .disp{font-size:34px;color:#fff;margin:0}
.foot p{max-width:40ch;margin:14px 0 0}
.foot-c{display:grid;gap:6px;align-content:start}
.foot-c a{text-decoration:none;padding:4px 0}
.foot-c a:hover{color:#fff;text-decoration:underline;text-underline-offset:4px}

/* whatsapp */
.wa{position:fixed;inset-inline-end:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.wa-btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 20px 0 16px;border-radius:999px;border:0;background:#1d6e47;color:#fff;font-weight:600;font-size:var(--t-s);box-shadow:0 10px 30px -12px rgba(10,40,25,.7);transition:background-color .2s}
.wa-btn:hover{background:#155636}
.wa-card{width:min(340px,calc(100vw - 40px));background:#fff;color:var(--ink);border-radius:8px;overflow:hidden;box-shadow:0 30px 60px -24px rgba(10,30,20,.5);border:1px solid var(--line)}
.wa-card header{background:#1d6e47;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:var(--t-s);font-weight:600}
.wa-pre{padding:14px 16px 0;font-size:var(--t-xs);color:var(--mute);margin:0}
.wa-msg{margin:10px 16px 16px;padding:12px 14px;border-radius:4px 12px 12px 12px;background:#e5f2dc;font-size:var(--t-s);line-height:1.5;white-space:pre-line}
.wa-card .btn{width:calc(100% - 32px);margin:0 16px 16px}
.x{flex:none;border:1px solid currentColor;background:transparent;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:.8}
.x:hover{opacity:1}

/* modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(10,30,20,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{width:min(540px,100%);max-height:calc(100% - 24px);overflow:auto;background:#fff;border-radius:8px;padding:32px;color:var(--ink)}
.dlg-h{display:flex;justify-content:space-between;align-items:start;gap:16px}

@media (max-width:1000px){
  .links{display:none}
  .hero-in,.sp-grid,.sim,.food-in,.visit-in,.two{grid-template-columns:minmax(0,1fr)}
  .hero-in{gap:32px;padding-top:32px;min-height:0}
  .hero-arch{order:-1;justify-self:center;max-width:min(420px,78vw)}
  .hero-copy{padding-bottom:64px}
  .check-in{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .check .h3{grid-column:1/-1}
  .check .btn{grid-column:1/-1}
  .tiers{grid-template-columns:minmax(0,1fr)}
  .tier{border-inline-start:0;border-top:1px solid var(--line)}
  .tier:first-child{border-top:0}
  .rcpt{position:static}
  .sec{padding:80px 0}
  .look{grid-template-columns:repeat(2,minmax(0,1fr))}
  .food-arch{justify-self:center}
  .inc{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .wrap{padding-inline:18px}
  .bar .btn{display:none}
  .brand-n small{display:none}
  .check-in{grid-template-columns:minmax(0,1fr)}
  .mlist{columns:1}
  .look{grid-template-columns:minmax(0,1fr)}
  .panel,.rcpt,.dlg{padding:22px}
  .wa-btn span{display:none}
  .wa-btn{padding:0 15px}
  .tabs button{font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  .gd *{transition:none!important}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="gd {{langCls}}" dir="{{dir}}">

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e7c8"/><stop offset=".65" stop-color="#f3c88e"/><stop offset="1" stop-color="#efb27a"/></linearGradient>
<linearGradient id="gLawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c3c28f"/><stop offset="1" stop-color="#8b9262"/></linearGradient>
<linearGradient id="gHero" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2f35"/><stop offset=".42" stop-color="#b57a5a"/><stop offset=".72" stop-color="#f0b97a"/><stop offset="1" stop-color="#f8dca4"/></linearGradient>
<linearGradient id="gGround" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6e7447"/><stop offset="1" stop-color="#262b1b"/></linearGradient>
<radialGradient id="gGlow"><stop offset="0" stop-color="#ffe8ad" stop-opacity=".95"/><stop offset="1" stop-color="#ffe8ad" stop-opacity="0"/></radialGradient>
</defs></svg>

<header class="bar">
<div class="wrap bar-in">
<a class="brand" href="#top" aria-label="The Garden Venue">
<svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#E8A33D" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#0F2C20" stroke-opacity=".55"/><path d="M12 29c-4-4-5-10-2-15M28 29c4-4 5-10 2-15"/><g fill="#E8A33D" stroke="none"><ellipse cx="9.6" cy="17" rx="1.2" ry="2.6" transform="rotate(-20 9.6 17)"/><ellipse cx="9.4" cy="22" rx="1.2" ry="2.6" transform="rotate(-45 9.4 22)"/><ellipse cx="11.6" cy="26.4" rx="1.2" ry="2.6" transform="rotate(-65 11.6 26.4)"/><ellipse cx="30.4" cy="17" rx="1.2" ry="2.6" transform="rotate(20 30.4 17)"/><ellipse cx="30.6" cy="22" rx="1.2" ry="2.6" transform="rotate(45 30.6 22)"/><ellipse cx="28.4" cy="26.4" rx="1.2" ry="2.6" transform="rotate(65 28.4 26.4)"/></g><path d="M20 11v6M17.5 13.5c1.5 0 2.5 1 2.5 2.5 0-1.5 1-2.5 2.5-2.5"/><path d="M15 23h10"/></svg>
<span class="brand-n">The Garden<small>Venue</small></span>
</a>
<nav class="links" aria-label="{{t.navAria}}">
<a href="#day">{{t.nDay}}</a><a href="#spaces">{{t.nSpaces}}</a><a href="#packages">{{t.nPackages}}</a><a href="#food">{{t.nFood}}</a><a href="#weddings">{{t.nWeddings}}</a><a href="#visit">{{t.nVisit}}</a>
</nav>
<div class="bar-end">
<div class="lang" role="group" aria-label="Language">
<button class="{{enOn}}" onClick="{{setEn}}" aria-pressed="{{enPressed}}" lang="en">EN</button>
<button class="{{arOn}}" onClick="{{setAr}}" aria-pressed="{{arPressed}}" lang="ar">عربي</button>
</div>
<a href="#check" class="btn btn-v">{{t.navCta}}</a>
</div>
</div>
</header>

<!-- HERO: the Instagram bio, word for word -->
<section class="hero" id="top">
<div class="wrap hero-in">
<div class="hero-copy">
<p class="bio-name" data-fade data-motion>{{t.bioName}}</p>
<h1 class="h1">
<span class="ln"><span data-motion>{{t.h1a}}</span></span>
<span class="ln"><span data-motion>{{t.h1b}}</span></span>
</h1>
<p class="bio-lines" data-fade data-motion><span>{{t.bio1}}</span><span>{{t.bio2}}</span></p>
<ul class="bio-meta" data-fade data-motion>
<li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>{{t.bioLoc}}</li>
<li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg><a href="tel:+201003863568" dir="ltr">0100 386 3568</a></li>
</ul>
<div class="hero-cta" data-fade data-motion>
<a class="btn btn-v" href="{{waUrl}}" target="_blank" rel="noopener"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>{{t.heroWa}}</a>
<a class="btn btn-line" href="#packages">{{t.heroPk}}</a>
</div>
</div>
<figure class="arch hero-arch" style="margin:0">
<div class="arch-ph" data-motion><img class="ph" src="images/ig/DegYWYUm_gs.jpg" alt="{{t.heroAlt}}" fetchpriority="high" data-motion></div>
<i class="drape l" data-motion aria-hidden="true"></i><i class="drape r" data-motion aria-hidden="true"></i>
</figure>
</div>
</section>

<!-- DATE CHECK -->
<section class="check" id="check">
<div class="wrap">
<div class="check-in">
<h2 class="h3">{{t.ckTitle}}</h2>
<label class="fld"><span>{{t.ckDate}}</span><input class="inp" type="date" min="{{today}}" value="{{date}}" onChange="{{onDate}}"></label>
<div class="fld"><span>{{t.ckGuests}}</span>
<div class="step"><button aria-label="{{t.fewer}}" onClick="{{guestsDec}}">−</button><b>{{guestsFmt}}</b><button aria-label="{{t.more}}" onClick="{{guestsInc}}">+</button></div></div>
<button class="btn btn-v" onClick="{{check}}">{{t.ckBtn}}</button>
</div>
<sc-if value="{{hasAvail}}" hint-placeholder-val="{{false}}">
<div class="result" role="status">
<div><b><span class="dot" style="background: {{availColor}}"></span>{{availTitle}}</b>
<sc-if value="{{hasNext}}" hint-placeholder-val="{{false}}"><small>{{t.next}}: {{nextDate}}</small></sc-if>
<small>{{t.ckNote}}</small></div>
<a class="btn btn-wa" href="{{waUrl}}" target="_blank" rel="noopener">{{t.ckWa}}</a>
</div>
</sc-if>
</div>
</section>

<!-- THE DAY: KATB KETAB + RECEPTION -->
<section class="sec" id="day">
<div class="wrap">
<h2 class="h2">{{t.moTitle}}</h2>
<p class="lead">{{t.moSub}}</p>
<div class="two">
<article class="moment">
<div class="arch"><img class="ph" src="images/ig/DegY4opG2nA.jpg" alt="{{t.altDay}}" style="object-position:50% 55%" loading="lazy"></div>
<p class="when">{{t.moDayWhen}}</p>
<h3 class="h3">{{t.moDayTitle}}</h3>
<p>{{t.moDaySub}}</p>
<p class="list">{{dayList}}</p>
</article>
<article class="moment">
<div class="arch"><img class="ph" src="images/ig/DegX71uGwtq.jpg" alt="{{t.altEve}}" style="object-position:50% 40%" loading="lazy"></div>
<p class="when">{{t.moEveWhen}}</p>
<h3 class="h3">{{t.moEveTitle}}</h3>
<p>{{t.moEveSub}}</p>
<p class="list">{{eveList}}</p>
</article>
</div>
<h3 class="h3 inc-h">{{t.incTitle}}</h3>
<ul class="inc">
<sc-for list="{{incItems}}" as="ic" hint-placeholder-count="8"><li><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.d}}"/></svg><div><b>{{ic.name}}</b><span>{{ic.desc}}</span></div></li></sc-for>
</ul>
</div>
</section>

<!-- SPACES -->
<section class="sec sp {{nightCls}}" id="spaces">
<div class="wrap">
<div class="sp-head">
<div><h2 class="h2">{{t.spTitle}}</h2><p class="lead">{{t.spSub}}</p></div>
<button class="sw" role="switch" aria-checked="{{nightStr}}" aria-label="{{t.toggleAria}}" onClick="{{flipNight}}"><span class="sw-t">{{t.dayShort}}</span><span class="sw-k"><i></i></span><span class="sw-t">{{t.nightShort}}</span></button>
</div>
<div class="tabs" role="tablist">
<sc-for list="{{spaceTabs}}" as="st" hint-placeholder-count="3"><button role="tab" class="{{st.cls}}" aria-selected="{{st.sel}}" onClick="{{st.pick}}">{{st.name}}</button></sc-for>
<i style="inset-inline-start: {{spTabX}}; width: {{spTabW}}"></i>
</div>
<div class="sp-grid">
<div class="scene">
<!-- Ceremony Garden: arch aisle (photos) -->
<div class="lay" style="opacity: {{p0d}}"><img class="ph" src="images/ig/DegYOETm8iv.jpg" alt="{{t.alt0d}}" style="object-position:50% 58%" loading="lazy"></div>
<div class="lay" style="opacity: {{p0n}}"><img class="ph" src="images/ig/DegYjkKG2ao.jpg" alt="{{t.alt0n}}" style="object-position:50% 55%" loading="lazy"></div>
<!-- Main Lawn & Kosha Stage (photos) -->
<div class="lay" style="opacity: {{p1d}}"><img class="ph" src="images/ig/DegYdB6m5lh.jpg" alt="{{t.alt1d}}" style="object-position:50% 62%" loading="lazy"></div>
<div class="lay" style="opacity: {{p1n}}"><img class="ph" src="images/ig/DegYzL8G-zA.jpg" alt="{{t.alt1n}}" style="object-position:50% 45%" loading="lazy"></div>
<!-- Bridal Villa -->
<div class="lay" style="opacity: {{sc2}}">
<svg viewBox="0 0 800 560" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<rect width="800" height="560" fill="url(#gSky)"/>
<circle cx="660" cy="220" r="56" fill="#fbe0a0" opacity=".9"/>
<path d="M0 360 Q250 310 500 350 T800 340 V430 H0Z" fill="#b9b784"/>
<rect y="420" width="800" height="140" fill="url(#gLawn)"/>
<rect x="190" y="230" width="420" height="200" fill="#f0e1c6"/>
<polygon points="168,236 400,160 632,236" fill="#b6694a"/>
<rect x="168" y="232" width="464" height="9" fill="#9d5439"/>
<g fill="#e8d6b4" stroke="#c9b27f" stroke-width="2"><path d="M250 330 V280 Q250 252 276 252 Q302 252 302 280 V330Z"/><path d="M374 330 V280 Q374 252 400 252 Q426 252 426 280 V330Z"/><path d="M498 330 V280 Q498 252 524 252 Q550 252 550 280 V330Z"/><path d="M236 420 V372 Q236 350 258 350 Q280 350 280 372 V420Z"/><path d="M520 420 V372 Q520 350 542 350 Q564 350 564 372 V420Z"/></g>
<path d="M365 430 V380 Q365 346 400 346 Q435 346 435 380 V430Z" fill="#7b5a3c" stroke="#c9b27f" stroke-width="2"/>
<rect x="240" y="334" width="320" height="8" fill="#d9c59b"/>
<rect x="330" y="430" width="140" height="10" fill="#e6dcc6"/><rect x="316" y="440" width="168" height="10" fill="#d9ceb4"/>
<g stroke="#4b3a28" stroke-width="7" fill="none" stroke-linecap="round"><path d="M110 460 Q118 340 100 270"/><path d="M700 460 Q690 350 712 280"/></g>
<g fill="#4f6a3a"><ellipse cx="78" cy="262" rx="46" ry="12" transform="rotate(-25 78 262)"/><ellipse cx="124" cy="256" rx="46" ry="12" transform="rotate(20 124 256)"/><ellipse cx="100" cy="240" rx="40" ry="11" transform="rotate(-80 100 240)"/><ellipse cx="690" cy="274" rx="46" ry="12" transform="rotate(-22 690 274)"/><ellipse cx="736" cy="270" rx="46" ry="12" transform="rotate(24 736 270)"/><ellipse cx="712" cy="254" rx="40" ry="11" transform="rotate(-80 712 254)"/></g>
<rect y="470" width="800" height="14" fill="#5d6b3c" opacity=".6"/>
</svg>
</div>
<div class="nightov" style="opacity: {{nightOv}}"></div>
<!-- night lights, per space -->
<div class="lay" style="opacity: {{lt2}}">
<svg viewBox="0 0 800 560" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<g fill="#fff"><circle class="tw" cx="70" cy="50" r="1.6"/><circle class="tw" cx="220" cy="100" r="1.4"/><circle class="tw" cx="380" cy="40" r="1.8"/><circle class="tw" cx="540" cy="90" r="1.4"/><circle class="tw" cx="700" cy="60" r="1.6"/></g>
<g fill="#ffcf7a"><path d="M250 330 V280 Q250 252 276 252 Q302 252 302 280 V330Z"/><path d="M374 330 V280 Q374 252 400 252 Q426 252 426 280 V330Z"/><path d="M498 330 V280 Q498 252 524 252 Q550 252 550 280 V330Z"/><path d="M236 420 V372 Q236 350 258 350 Q280 350 280 372 V420Z"/><path d="M520 420 V372 Q520 350 542 350 Q564 350 564 372 V420Z"/></g>
<g><circle cx="276" cy="290" r="60" fill="url(#gGlow)"/><circle cx="400" cy="290" r="60" fill="url(#gGlow)"/><circle cx="524" cy="290" r="60" fill="url(#gGlow)"/><circle cx="258" cy="385" r="50" fill="url(#gGlow)"/><circle cx="542" cy="385" r="50" fill="url(#gGlow)"/></g>
<g fill="#ffe2a0"><circle cx="340" cy="392" r="5"/><circle cx="460" cy="392" r="5"/></g>
<g><circle cx="340" cy="392" r="26" fill="url(#gGlow)"/><circle cx="460" cy="392" r="26" fill="url(#gGlow)"/></g>
<path d="M60 300 Q400 380 740 300" fill="none" stroke="#5a4a2c" stroke-width="1.5"/>
<g fill="#ffe2a0"><circle cx="150" cy="332" r="4"/><circle cx="250" cy="352" r="4"/><circle cx="350" cy="364" r="4"/><circle cx="450" cy="364" r="4"/><circle cx="550" cy="352" r="4"/><circle cx="650" cy="332" r="4"/></g>
</svg>
</div>
</div>

<div class="sp-info">
<h3 class="h3">{{curSpace.name}}</h3>
<p>{{curSpace.desc}}</p>
<ul class="amen">
<sc-for list="{{curSpace.amen}}" as="a" hint-placeholder-count="4"><li><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.d}}"/></svg>{{a.label}}</li></sc-for>
</ul>
<a href="#visit" class="btn btn-line">{{t.spCta}}</a>
</div>
</div>
</div>
</section>

<!-- PACKAGES -->
<section class="sec" id="packages">
<div class="wrap">
<h2 class="h2">{{t.pkTitle}}</h2>
<p class="lead">{{t.pkSub}}</p>
<div class="tiers">
<sc-for list="{{tierCards}}" as="c" hint-placeholder-count="3">
<div class="tier {{c.cls}}">
<h3 class="h3">{{c.name}}</h3>
<p class="price"><b>{{c.price}}</b>{{t.egp}} {{t.perGuest}}</p>
<p class="min">{{c.min}}</p>
<ul><sc-for list="{{c.features}}" as="f" hint-placeholder-count="4"><li>{{f}}</li></sc-for></ul>
<button class="btn {{c.btn}}" aria-pressed="{{c.p}}" onClick="{{c.pick}}">{{c.btnLabel}}</button>
</div>
</sc-for>
</div>
<p class="note">{{t.pkNote}}</p>

<div class="sim" id="budget">
<div>
<h3 class="h3">{{t.simTitle}}</h3>
<p class="lead" style="margin-top:8px">{{t.simSub}}</p>
<div class="ctl">
<label class="lbl" for="g"><span>{{t.simGuests}}</span><span class="bignum">{{guestsFmt}}</span></label>
<input id="g" class="range" type="range" min="100" max="700" step="10" value="{{guests}}" onChange="{{onGuests}}" style="--p: {{guestPct}}">
<div class="minmax"><span>{{minLabel}}</span><span>{{maxLabel}}</span></div>
</div>
<div class="ctl">
<div class="lbl"><span>{{t.simOcc}}</span></div>
<div class="seg" role="group" aria-label="{{t.simOcc}}">
<i style="width: calc(33.333% - 2px); inset-inline-start: calc({{occX}} + 3px)"></i>
<sc-for list="{{occBtns}}" as="ob" hint-placeholder-count="3"><button class="{{ob.cls}}" aria-pressed="{{ob.p}}" onClick="{{ob.pick}}">{{ob.name}}</button></sc-for>
</div>
</div>
<div class="ctl">
<div class="lbl"><span>{{t.simDay}}</span></div>
<div class="seg" role="group" aria-label="{{t.simDay}}">
<i style="width: calc(50% - 3px); inset-inline-start: calc({{dayX}} + 3px)"></i>
<button class="{{peakOn}}" aria-pressed="{{peakP}}" onClick="{{setPeak}}">{{t.dayPeak}}</button>
<button class="{{midOn}}" aria-pressed="{{midP}}" onClick="{{setMid}}">{{t.dayMid}}</button>
</div>
</div>
<div class="ctl">
<div class="lbl"><span>{{t.simTier}}</span></div>
<div class="seg" role="group" aria-label="{{t.simTier}}">
<i style="width: calc(33.333% - 2px); inset-inline-start: calc({{tierX}} + 3px)"></i>
<sc-for list="{{tierBtns}}" as="tb" hint-placeholder-count="3"><button class="{{tb.cls}}" aria-pressed="{{tb.p}}" onClick="{{tb.pick}}">{{tb.name}}</button></sc-for>
</div>
</div>
<div class="ctl">
<div class="lbl"><span>{{t.simAdds}}</span></div>
<div class="adds">
<sc-for list="{{addBtns}}" as="ad" hint-placeholder-count="3">
<button class="add {{ad.cls}}" aria-pressed="{{ad.p}}" onClick="{{ad.pick}}">
<span class="ck"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
<span><b>{{ad.name}}</b><small>{{ad.desc}}</small></span>
<em>{{ad.price}}</em>
</button>
</sc-for>
</div>
</div>
</div>

<div class="rcpt">
<div class="lbl"><span>{{t.rcTotal}}</span></div>
<div class="total" aria-live="polite"><small>{{t.egp}}</small>{{display}}</div>
<div style="font-size:var(--t-s);color:#b9cabe;margin-top:4px">{{t.about}} {{t.egp}} {{perHeadFmt}} {{t.perGuest}}</div>
<hr>
<div class="line"><span>{{tierName}}, {{occName}}, {{billedFmt}} {{t.guestsWord}}</span><span>{{baseFmt}}</span></div>
<sc-if value="{{both}}" hint-placeholder-val="{{false}}"><div class="line"><span>{{t.rcKetab}}</span><span>{{ketabFmt}}</span></div></sc-if>
<sc-if value="{{peakSel}}" hint-placeholder-val="{{true}}"><div class="line" style="color:var(--lantern)"><span>{{t.rcPeak}}</span><span>{{t.rcIncl}}</span></div></sc-if>
<sc-if value="{{zaffa}}" hint-placeholder-val="{{false}}"><div class="line"><span>{{t.add1}}</span><span>{{zaffaFmt}}</span></div></sc-if>
<sc-if value="{{carving}}" hint-placeholder-val="{{false}}"><div class="line"><span>{{t.add2}}</span><span>{{carvingFmt}}</span></div></sc-if>
<sc-if value="{{villa}}" hint-placeholder-val="{{false}}"><div class="line"><span>{{t.add3}}</span><span>{{villaFmt}}</span></div></sc-if>
<hr>
<sc-if value="{{underMin}}" hint-placeholder-val="{{false}}"><p class="fine">{{t.rcMin}}</p></sc-if>
<sc-if value="{{overCap}}" hint-placeholder-val="{{false}}"><p class="fine" style="color:var(--lantern)">{{t.rcOver}}</p></sc-if>
<p class="fine">{{t.rcVat}}</p>
<a class="btn btn-amber" href="{{waUrl}}" target="_blank" rel="noopener">{{t.rcWa}}</a>
</div>
</div>
</div>
</section>

<!-- FOOD -->
<section class="sec food" id="food">
<div class="wrap food-in">
<div>
<h2 class="h2">{{t.caTitle}}</h2>
<p class="lead">{{t.caSub}}</p>
<div class="tabs" role="tablist">
<sc-for list="{{menuTabs}}" as="m" hint-placeholder-count="3"><button role="tab" class="{{m.cls}}" aria-selected="{{m.sel}}" onClick="{{m.pick}}">{{m.name}}</button></sc-for>

    const M = window.Motion;
    if (!M || !document.documentElement.classList.contains('mo')) return;
    const out = [0.65, 0, 0.35, 1], soft = [0.22, 1, 0.36, 1];

    M.animate('.hero .ln > span', { y: ['106%', '0%'] }, { duration: 1.1, delay: M.stagger(0.1, { startDelay: 0.7 }), ease: soft });
    M.animate('.hero [data-fade]', { opacity: [0, 1], y: [12, 0] }, { duration: 0.9, delay: M.stagger(0.08, { startDelay: 1.05 }), ease: soft });

  }

    const M = window.Motion, s = this.state, seen = this._seen;

    if (ok && s.filter !== seen.filter) M.animate('.look .tile', { opacity: [0, 1], scale: [0.97, 1] }, { type: 'spring', stiffness: 300, damping: 28, delay: M.stagger(0.05) });
    this._seen = { filter: s.filter, taste: s.tasteOpen, wa: s.waOpen };
  }
  syncLang() {
    const l = this.state.lang;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';

      underMin: s.guests < td.min, overCap: s.guests > 600,

      openTaste: set({ tasteOpen: true, tasteSent: false, tasteErr: false }), closeTaste: set({ tasteOpen: false }), stop: (e) => e.stopPropagation(),
      tasteOpen: s.tasteOpen, tasteSent: s.tasteSent, tasteForm: !s.tasteSent, tasteErr: s.tasteErr,
      tasteName: s.tasteName, tastePhone: s.tastePhone, tasteMenu: s.tasteMenu, tasteDate: s.tasteDate,
      onTasteName: inp('tasteName'), onTastePhone: inp('tastePhone'), onTasteMenu: inp('tasteMenu'), onTasteDate: inp('tasteDate'),
      tasteSubmit: () => { if (!s.tasteName.trim() || !s.tastePhone.trim()) { this.setState({ tasteErr: true }); } else { this.setState({ tasteSent: true, tasteErr: false }); } },
      tasteSummary: tasteTxt + ', ' + (s.tasteDate ? fmtDate(s.tasteDate) : L('date to be agreed', 'التاريخ هيتحدد')),
      tasteWa: 'https://wa.me/' + WA + '?text=' + encodeURIComponent(tasteMsg),
      // weddings
      filters, tiles,
      // tour
      tourOpen: !s.tourSent, tourSent: s.tourSent, tourErr: s.tourErr, slots,
      tourX: s.tourType === 'in' ? '0%' : '50%', tourInOn: on(s.tourType === 'in'), tourVidOn: on(s.tourType === 'vid'),
      tourInP: String(s.tourType === 'in'), tourVidP: String(s.tourType === 'vid'),
      setTourIn: set({ tourType: 'in' }), setTourVid: set({ tourType: 'vid' }),
      tourDesc: s.tourType === 'in' ? L('Come at the hour you plan to celebrate to see the light you will get.', 'تعالى في نفس ميعاد فرحك عشان تشوف الإضاءة هتبقى عاملة إزاي.') : L('A live video call from the garden, for couples and families abroad.', 'مكالمة فيديو لايف من الجنينة، للعرسان والعيلات اللي برة مصر.'),
      tourDate: s.tourDate, tourName: s.tourName, tourPhone: s.tourPhone,
      onTourDate: inp('tourDate'), onTourName: inp('tourName'), onTourPhone: inp('tourPhone'),
      tourSubmit: () => { if (!s.tourName.trim() || !s.tourPhone.trim()) { this.setState({ tourErr: true }); } else { this.setState({ tourSent: true, tourErr: false }); } },
      tourReset: set({ tourSent: false }), tourSummary, tourWa: 'https://wa.me/' + WA + '?text=' + encodeURIComponent(tourMsg),
      // whatsapp
      waOpen: s.waOpen, waStr: String(s.waOpen), waMsg: msg,
      toggleWa: () => this.setState({ waOpen: !s.waOpen }), closeWa: set({ waOpen: false })
    };
  }
