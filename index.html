<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Garden Venue | New Cairo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
html{scroll-behavior:smooth}body{margin:0}
.gd{--iv:#FAF8F5;--ink:#13241C;--forest:#173328;--gold:#B89758;--goldd:#7E6226;--goldl:#D9BC82;--olive:#6B7048;--sand:#EDE6D8;--hair:rgba(28,25,23,.16);--ease:cubic-bezier(.22,1,.36,1);background:var(--iv);color:var(--ink);font-size:16px;line-height:1.6;overflow-x:clip;position:relative;-webkit-font-smoothing:antialiased}
.gd *{box-sizing:border-box}
.gd.en{font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.gd.ar{font-family:'Cairo',system-ui,sans-serif}
.gd.en .serif{font-family:'Cormorant Garamond',Georgia,serif}
.gd.ar .serif{font-family:'Cairo',system-ui,sans-serif;font-weight:300}
.gd.ar .track{letter-spacing:0!important;text-transform:none!important}
.gd button,.gd input,.gd select{font:inherit;color:inherit}
.gd button{cursor:pointer}
.gd a{color:inherit;text-decoration:none}
.gd :focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:28px}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;color:var(--goldd)}
.dk .eyebrow,.sp.night .eyebrow{color:var(--goldl)}
.h2{font-size:clamp(38px,5vw,64px);line-height:1.04;font-weight:300;margin:14px 0 0;letter-spacing:-.01em}
.gd.ar .h2{line-height:1.3;font-size:clamp(34px,4.4vw,54px)}
.lead{font-size:17px;max-width:560px;opacity:.78;margin:18px 0 0}
.hair{border:1px solid var(--hair)}
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 26px;border-radius:999px;border:1px solid transparent;font-weight:500;font-size:14px;letter-spacing:.02em;transition:color .5s var(--ease),border-color .5s var(--ease),transform .4s var(--ease);white-space:nowrap}
.btn::before{content:'';position:absolute;inset:0;z-index:-1;transform:translateY(102%);transition:transform .55s var(--ease)}
.btn:hover::before{transform:none}
.btn:active{transform:scale(.98)}
.btn-g{background:var(--gold);color:var(--ink)}
.btn-g::before{background:var(--ink)}
.btn-g:hover{color:var(--goldl)}
.btn-d{background:var(--ink);color:var(--iv)}
.btn-d::before{background:var(--gold)}
.btn-d:hover{color:var(--ink)}
.btn-o{border-color:currentColor;color:inherit;background:transparent}
.btn-o::before{background:var(--gold)}
.btn-o:hover{color:var(--ink);border-color:var(--gold)}
.btn-wa{background:#1f7a4d;color:#fff}
.btn-wa::before{background:var(--ink)}
.navw{position:sticky;top:0;z-index:60;height:0}
.nav{margin:14px auto 0;width:min(1240px,calc(100% - 24px));display:flex;align-items:center;gap:16px;justify-content:space-between;padding:8px 10px 8px 22px;border-radius:999px;background:rgba(18,38,29,.62);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid rgba(255,255,255,.2);color:#fff}
.nav-links{display:flex;gap:26px;font-size:13px;letter-spacing:.04em}
.nav-links a{opacity:.82;padding:10px 0;transition:opacity .3s}
.nav-links a:hover{opacity:1;color:var(--goldl)}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:3px;position:relative}
.lang button{position:relative;z-index:1;border:0;background:transparent;color:#fff;min-width:44px;min-height:36px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:500;transition:color .4s}
.lang button.on{color:var(--ink)}
.lang i{position:absolute;top:3px;bottom:3px;width:calc(50% - 3px);border-radius:999px;background:var(--goldl);transition:inset-inline-start .5s var(--ease)}
.short{display:none}
.hero{position:relative;min-height:900px;background:#2a2420;color:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.kb{position:absolute;inset:0;animation:kb 3.2s var(--ease) both}
.kb svg{width:100%;height:100%;display:block}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
.hero-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,15,12,.55) 0%,rgba(20,15,12,.05) 38%,rgba(20,15,12,.7) 100%)}
.hero-in{position:relative;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.85fr);gap:48px;align-items:end;padding-top:170px;padding-bottom:44px}
.h1{font-size:clamp(52px,8vw,118px);line-height:.96;font-weight:300;margin:22px 0 0;letter-spacing:-.02em}
.gd.ar .h1{line-height:1.25;font-size:clamp(46px,6.6vw,92px)}
.ml{display:block;overflow:hidden;padding-bottom:.1em;margin-bottom:-.1em}
.ml>span{display:block;transform:translateY(108%);animation:up 1.2s var(--ease) forwards}
.ml:nth-child(1)>span{animation-delay:.45s}
.ml:nth-child(2)>span{animation-delay:.6s}
.ml:nth-child(3)>span{animation-delay:.75s}
.fade-in{opacity:0;animation:fi 1.2s var(--ease) forwards}
@keyframes up{to{transform:none}}
@keyframes fi{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.glass{background:rgba(250,248,245,.13);backdrop-filter:blur(22px) saturate(1.35);-webkit-backdrop-filter:blur(22px) saturate(1.35);border:1px solid rgba(255,255,255,.3);border-radius:28px;color:#fff}
.field{display:flex;flex-direction:column;gap:6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:1}
.field>span{opacity:.82}
.inp{width:100%;min-height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.35);background:rgba(20,15,12,.35);padding:0 14px;font-size:15px;color:#fff;color-scheme:dark}
.inp-l{border:1px solid var(--hair);background:#fff;color:var(--ink);color-scheme:light;letter-spacing:0;text-transform:none}
.step{display:flex;align-items:center;justify-content:space-between;min-height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.35);background:rgba(20,15,12,.35);padding:0 6px}
.step button{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;line-height:1}
.step button:hover{background:var(--goldl);color:var(--ink)}
.result{border-radius:16px;padding:14px 16px;font-size:14px;background:rgba(20,15,12,.5);border:1px solid rgba(255,255,255,.22)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:8px}
.facts{position:relative;border-top:1px solid rgba(255,255,255,.28);background:rgba(20,15,12,.35);backdrop-filter:blur(12px)}
.facts-in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.fact{padding:22px 24px;border-inline-start:1px solid rgba(255,255,255,.2)}
.fact:first-child{border-inline-start:0;padding-inline-start:0}
.fact small{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.fact b{display:block;font-weight:400;font-size:20px;margin-top:4px}
.scroll-i{position:absolute;inset-inline-end:28px;top:50%;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;opacity:.8}
.scroll-i i{width:1px;height:64px;background:rgba(255,255,255,.35);position:relative;overflow:hidden}
.scroll-i i::after{content:'';position:absolute;left:0;top:-40%;width:1px;height:40%;background:#fff;animation:sc 2.2s var(--ease) infinite}
@keyframes sc{to{top:110%}}
.tw{animation:tw 3s ease-in-out infinite}
.tw:nth-child(2n){animation-delay:.8s}
.tw:nth-child(3n){animation-delay:1.7s}
@keyframes tw{0%,100%{opacity:.55}50%{opacity:1}}
.sec{padding:120px 0}
.sp{background:var(--iv);color:var(--ink);transition:background-color 1.4s var(--ease),color 1.4s var(--ease)}
.sp.night{background:#0f1d16;color:#f4ede1}
.sp-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:56px;margin-top:56px;align-items:start}
.scene{position:relative;aspect-ratio:8/5.6;border-radius:28px;overflow:hidden;isolation:isolate;background:#222}
.scene>.lay{position:absolute;inset:0;transition:opacity 1.2s var(--ease)}
.scene svg{width:100%;height:100%;display:block}
.nightov{position:absolute;inset:0;background:#171c3d;mix-blend-mode:multiply;transition:opacity 1.6s var(--ease);pointer-events:none}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid color-mix(in srgb,currentColor 22%,transparent);border-radius:999px;padding:0;position:relative;width:min(100%,620px)}
.tabs button{position:relative;z-index:1;border:0;background:transparent;min-height:52px;padding:0 12px;line-height:1.2;border-radius:999px;font-size:14px;font-weight:500;color:inherit;transition:color .4s}
.tabs i{position:absolute;top:4px;bottom:4px;margin-inline-start:4px;border-radius:999px;background:var(--ink);transition:inset-inline-start .6s var(--ease)}
.sp.night .tabs i{background:var(--goldl)}
.tabs button.on{color:var(--iv)}
.sp.night .tabs button.on{color:#0f1d16}
.toggle{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sw{position:relative;width:132px;height:56px;border-radius:999px;border:1px solid color-mix(in srgb,currentColor 28%,transparent);background:linear-gradient(90deg,#f4d9a3,#f0b57a);padding:0;transition:background .8s var(--ease)}
.sp.night .sw{background:linear-gradient(90deg,#2a3260,#171c3d)}
.sw i{position:absolute;top:4px;inset-inline-start:4px;width:46px;height:46px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;transition:inset-inline-start .7s var(--ease),background .6s;color:#8a5a1f}
.sp.night .sw i{inset-inline-start:78px;background:#ece6ff;color:#2a3260}
.sw span{position:absolute;top:50%;transform:translateY(-50%);font-size:11px;font-weight:600;letter-spacing:.06em;color:#3a2a10}
.sp.night .sw span{color:#d8d2f5}
.moment{font-size:13px;opacity:.8}
.specs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid color-mix(in srgb,currentColor 20%,transparent);border-bottom:1px solid color-mix(in srgb,currentColor 20%,transparent);margin-top:28px}
.specs div{padding:20px 0;border-inline-start:1px solid color-mix(in srgb,currentColor 20%,transparent);padding-inline-start:20px}
.specs div:first-child{border-inline-start:0;padding-inline-start:0}
.specs small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
.specs b{display:block;font-weight:300;font-size:40px;line-height:1.1;margin-top:4px;transition:opacity .4s}
.amen{display:flex;flex-direction:column;gap:12px;margin:18px 0 0;padding:0;list-style:none}
.amen li{display:flex;gap:12px;align-items:center;font-size:15px}
.amen svg{flex:none;color:var(--goldd)}
.sp.night .amen svg{color:var(--goldl)}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:56px}
.tier{position:relative;border:1px solid var(--hair);border-radius:28px;padding:34px 30px;background:#fff;display:flex;flex-direction:column;transition:transform .6s var(--ease),border-color .4s,box-shadow .6s var(--ease)}
.tier.on{border-color:var(--gold);box-shadow:0 30px 60px -30px rgba(126,98,38,.45);transform:translateY(-8px)}
.tier.dkt{background:var(--ink);color:#f4ede1;border-color:var(--ink)}
.price{font-size:54px;line-height:1;font-weight:300}
.tlist{list-style:none;padding:0;margin:24px 0 28px;display:flex;flex-direction:column;gap:12px;font-size:14.5px;flex:1}
.tlist li{display:flex;gap:10px;align-items:flex-start}
.tlist svg{flex:none;margin-top:4px;color:var(--goldd)}
.dkt .tlist svg{color:var(--goldl)}
.badge{position:absolute;top:-13px;inset-inline-start:30px;background:var(--gold);color:var(--ink);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding:5px 12px;border-radius:999px}
.sim{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.9fr);gap:28px;margin-top:96px;align-items:start}
.panel{border:1px solid var(--hair);border-radius:28px;padding:36px;background:#fff}
.ctl{margin-top:30px}
.ctl:first-child{margin-top:0}
.ctl>label,.ctl>.lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:#5a524a}
.bignum{font-size:48px;line-height:1;font-weight:300;letter-spacing:0;text-transform:none;color:var(--ink)}
.range{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:linear-gradient(90deg,var(--gold) var(--p,40%),var(--hair) var(--p,40%));margin:22px 0 6px;outline-offset:8px;border-radius:2px}
.gd.ar .range{background:linear-gradient(270deg,var(--gold) var(--p,40%),var(--hair) var(--p,40%))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--ink);border:4px solid var(--iv);box-shadow:0 0 0 1px var(--ink);cursor:grab}
.range::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--ink);border:4px solid var(--iv);cursor:grab}
.seg{display:flex;border:1px solid var(--hair);border-radius:999px;padding:0;position:relative;margin-top:14px;background:var(--iv)}
.seg button{position:relative;z-index:1;flex:1;border:0;background:transparent;min-height:52px;font-size:14px;font-weight:500;border-radius:999px;padding:0 10px;line-height:1.2;transition:color .4s}
.seg i{position:absolute;top:4px;bottom:4px;margin-inline-start:4px;border-radius:999px;background:var(--ink);transition:inset-inline-start .6s var(--ease)}
.seg button.on{color:var(--iv)}
.adds{display:grid;gap:10px;margin-top:14px}
.add{display:flex;align-items:center;gap:14px;text-align:start;border:1px solid var(--hair);border-radius:18px;background:var(--iv);padding:14px 16px;width:100%;min-height:64px;transition:border-color .4s,background .4s}
.add.on{border-color:var(--gold);background:#fbf3e2}
.add .ck{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;color:transparent;background:#fff;transition:all .4s var(--ease)}
.add.on .ck{background:var(--ink);color:var(--goldl);border-color:var(--ink)}
.add b{display:block;font-weight:500;font-size:15px}
.add small{display:block;font-size:12.5px;opacity:.7;line-height:1.4}
.add em{font-style:normal;font-size:13px;font-weight:600;color:var(--goldd);margin-inline-start:auto;white-space:nowrap}
.rcpt{position:sticky;top:96px;background:var(--ink);color:#f4ede1;border-radius:28px;padding:36px;overflow:hidden}
.rcpt hr{border:0;border-top:1px solid rgba(255,255,255,.16);margin:18px 0}
.line{display:flex;justify-content:space-between;gap:16px;font-size:14px;padding:5px 0;opacity:.88}
.total{font-size:clamp(44px,5vw,64px);font-weight:300;line-height:1.05;letter-spacing:-.01em;color:var(--goldl)}
.menu-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:56px;margin-top:48px;align-items:center}
.mlist{list-style:none;padding:0;margin:26px 0 30px;display:flex;flex-direction:column}
.mlist li{display:flex;gap:16px;align-items:baseline;padding:15px 0;border-top:1px solid rgba(255,255,255,.16);font-size:17px}
.mlist li span{font-size:12px;color:var(--goldl);letter-spacing:.1em;min-width:26px}
.dk{background:var(--forest);color:#f4ede1}
.menu-vis{position:relative;aspect-ratio:1/1.04;border-radius:200px 200px 28px 28px;overflow:hidden;background:#10251b}
.look{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:150px;gap:16px;margin-top:40px}
.tile{position:relative;border-radius:22px;overflow:hidden;animation:pop .9s var(--ease) both;color:#fff;display:flex;align-items:flex-end}
.tile svg{position:absolute;inset:0;width:100%;height:100%}
.tile p{position:relative;margin:0;padding:18px 20px;width:100%;font-size:21px;line-height:1.15;background:linear-gradient(0deg,rgba(20,15,12,.7),transparent)}
.tile small{display:block;font-family:'Plus Jakarta Sans',sans-serif;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.85;margin-bottom:6px}
.gd.ar .tile small{font-family:'Cairo',sans-serif;letter-spacing:0}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--hair);background:transparent;min-height:44px;padding:0 20px;border-radius:999px;font-size:14px;transition:all .4s var(--ease)}
.chip.on{background:var(--ink);color:var(--iv);border-color:var(--ink)}
.quotes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:64px}
.quote{border-top:1px solid var(--ink);padding-top:22px}
.quote q{display:block;quotes:none;font-size:25px;line-height:1.3;font-weight:400}
.gd.ar .quote q{font-size:20px;line-height:1.7}
.tour{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:start}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.slot{border:1px solid var(--hair);background:#fff;min-height:44px;padding:0 18px;border-radius:12px;font-size:14px;transition:all .3s}
.slot.on{background:var(--ink);color:var(--iv);border-color:var(--ink)}
.toast{display:flex;gap:14px;align-items:flex-start;background:#eef3e6;border:1px solid #b9c79b;border-radius:18px;padding:18px}
.foot{background:#0f2219;color:#cfc6b8;padding:64px 0 120px;font-size:14px}
.wa{position:fixed;inset-inline-end:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.wa-pill{display:inline-flex;align-items:center;gap:10px;min-height:56px;padding:0 22px 0 16px;border-radius:999px;border:0;background:#1f7a4d;color:#fff;font-weight:500;font-size:14px;box-shadow:0 14px 34px -10px rgba(20,60,40,.7);animation:float 3.6s ease-in-out infinite}
.wa-pill:hover{background:#176240}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.wa-card{width:min(340px,calc(100vw - 40px));background:#fff;color:var(--ink);border-radius:22px;overflow:hidden;box-shadow:0 30px 70px -20px rgba(0,0,0,.45);border:1px solid var(--hair);animation:fi .5s var(--ease) both}
.wa-card header{background:#1f7a4d;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.wa-msg{margin:16px;padding:14px;border-radius:4px 16px 16px 16px;background:#e7f3d9;font-size:13.5px;line-height:1.55;white-space:pre-line}
.modal{position:fixed;inset:0;z-index:100;background:rgba(20,15,12,.6);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fi .4s var(--ease) both}
.dlg{width:min(560px,100%);max-height:calc(100% - 24px);overflow:auto;background:var(--iv);border-radius:28px;padding:36px;color:var(--ink)}
.x{border:1px solid var(--hair);background:transparent;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.stack{display:grid;gap:14px}
.px{will-change:transform}
@supports (animation-timeline: view()){
.rv{animation:rv both var(--ease);animation-timeline:view();animation-range:entry 4% cover 26%}
.px{animation:pxm linear both;animation-timeline:view();animation-range:cover 0% cover 100%}
}
@keyframes rv{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes pxm{from{transform:translateY(36px)}to{transform:translateY(-36px)}}

/* photos */
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hero .ph{transform:scale(1.2);transform-origin:50% 66%}
.scene .lay img.ph{transition:transform 6s var(--ease)}
.scene:hover .lay img.ph{transform:scale(1.03)}
.mo .ph{z-index:-3}
.mo::before{content:'';position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(10,20,15,.2) 0%,rgba(10,20,15,.55) 45%,rgba(10,20,15,.88) 100%)}
.mo.day,.mo.eve{color:#fff;min-height:440px}
.mo.day .when{color:#F3D9A4;opacity:1}
.tile .ph{transition:transform 1.2s var(--ease)}
.tile:hover .ph{transform:scale(1.05)}
.photo-credit{display:flex;gap:10px;align-items:center}
/* moments + inclusions */
.moments{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:56px}
.mo{position:relative;border-radius:28px;padding:34px 32px;overflow:hidden;isolation:isolate;min-height:330px;display:flex;flex-direction:column}
.mo.day{background:#6b5a3c}
.mo.eve{background:#0f1d16}
.mo .when{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;opacity:.75}
.mo h3{font-size:clamp(30px,3.2vw,42px);font-weight:300;line-height:1.15;margin:10px 0 0}
.mo p{margin:12px 0 0;opacity:.85;max-width:440px}
.mo ul{list-style:none;padding:0;margin:auto 0 0;padding-top:22px;display:flex;flex-wrap:wrap;gap:8px}
.mo li{font-size:13px;padding:7px 14px;border-radius:999px;border:1px solid color-mix(in srgb,currentColor 30%,transparent)}
.mo .orn{position:absolute;inset-inline-end:-24px;top:-24px;width:190px;height:190px;opacity:.25;z-index:-1}
.inc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin-top:20px;background:var(--hair);border:1px solid var(--hair);border-radius:28px;overflow:hidden}
.inc div{background:#fff;padding:26px 24px}
.inc svg{color:var(--goldd)}
.inc b{display:block;font-weight:500;font-size:15.5px;margin-top:14px}
.inc small{display:block;font-size:13px;opacity:.7;margin-top:4px;line-height:1.5}
.minp{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--gold) 18%,transparent);align-self:flex-start}
.dkt .minp{background:rgba(217,188,130,.16);color:var(--goldl)}
.seg.s3 button{font-size:13px}
@media (max-width:1000px){
.hero-in,.sp-grid,.sim,.menu-grid,.tour{grid-template-columns:minmax(0,1fr)}
.tiers,.quotes,.moments{grid-template-columns:minmax(0,1fr)}
.inc{grid-template-columns:repeat(2,minmax(0,1fr))}
.nav-links{display:none}
.facts-in{grid-template-columns:repeat(2,minmax(0,1fr))}
.fact:nth-child(3){border-inline-start:0;padding-inline-start:0}
.sec{padding:84px 0}
.rcpt{position:static}
.scroll-i{display:none}
.look{grid-template-columns:repeat(6,minmax(0,1fr))}
.tile{grid-column:span 3!important;grid-row:span 2!important}
.hero-in{padding-top:130px}
}
@media (max-width:560px){
.wrap{padding-inline:18px}
.long{display:none}
.short{display:inline}
.nav{padding-inline-start:14px;gap:8px}
.panel,.rcpt,.dlg{padding:22px}
.tile{grid-column:span 6!important}
.specs b{font-size:30px}
.nav .btn{padding:0 14px;font-size:13px}
.nav>a .serif{font-size:20px!important;white-space:nowrap}
.nav>a .track{display:none}
.nav>a>svg{width:32px;height:32px}
.lang button{min-width:38px;padding:0 8px}
.price{font-size:44px}
.inc{grid-template-columns:minmax(0,1fr)}
.mo{padding:26px 22px;min-height:0}
}
@media (prefers-reduced-motion:reduce){
.kb,.ml>span,.fade-in,.tile,.wa-pill,.tw,.scroll-i i::after{animation:none!important}
.ml>span{transform:none}.fade-in{opacity:1}
.rv,.px{animation:none!important}
}
</style>

</head>
<body>
<div id="app"></div>
<template id="tpl">


<div class="gd {{langCls}}" dir="{{dir}}">

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e7c8"/><stop offset=".65" stop-color="#f3c88e"/><stop offset="1" stop-color="#efb27a"/></linearGradient>
<linearGradient id="gLawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c3c28f"/><stop offset="1" stop-color="#8b9262"/></linearGradient>
<linearGradient id="gHero" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2f35"/><stop offset=".42" stop-color="#b57a5a"/><stop offset=".72" stop-color="#f0b97a"/><stop offset="1" stop-color="#f8dca4"/></linearGradient>
<linearGradient id="gGround" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6e7447"/><stop offset="1" stop-color="#262b1b"/></linearGradient>
<radialGradient id="gGlow"><stop offset="0" stop-color="#ffe8ad" stop-opacity=".95"/><stop offset="1" stop-color="#ffe8ad" stop-opacity="0"/></radialGradient>
</defs></svg>

<!-- FLOATING NAV -->
<div class="navw">
<nav class="nav" aria-label="Main">
<a href="#top" style="display:flex;align-items:center;gap:12px">
<svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#D9BC82" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#173328" stroke="#D9BC82" stroke-opacity=".5"/><path d="M12 29c-4-4-5-10-2-15M28 29c4-4 5-10 2-15"/><g fill="#D9BC82" stroke="none"><ellipse cx="9.6" cy="17" rx="1.2" ry="2.6" transform="rotate(-20 9.6 17)"/><ellipse cx="9.4" cy="22" rx="1.2" ry="2.6" transform="rotate(-45 9.4 22)"/><ellipse cx="11.6" cy="26.4" rx="1.2" ry="2.6" transform="rotate(-65 11.6 26.4)"/><ellipse cx="30.4" cy="17" rx="1.2" ry="2.6" transform="rotate(20 30.4 17)"/><ellipse cx="30.6" cy="22" rx="1.2" ry="2.6" transform="rotate(45 30.6 22)"/><ellipse cx="28.4" cy="26.4" rx="1.2" ry="2.6" transform="rotate(65 28.4 26.4)"/></g><path d="M20 11v6M17.5 13.5c1.5 0 2.5 1 2.5 2.5 0-1.5 1-2.5 2.5-2.5"/><path d="M15 23h10"/></svg>
<span style="display:flex;flex-direction:column;line-height:1.05"><span class="serif" style="font-size:24px;font-weight:400">The Garden</span><span class="track" style="font-size:9px;letter-spacing:.34em;text-transform:uppercase;opacity:.8">{{t.brandSub}}</span></span>
</a>
<div class="nav-links">
<a href="#moments">{{t.nMoments}}</a><a href="#spaces">{{t.nSpaces}}</a><a href="#packages">{{t.nPackages}}</a><a href="#catering">{{t.nCatering}}</a><a href="#weddings">{{t.nWeddings}}</a><a href="#tour">{{t.nVisit}}</a>
</div>
<div style="display:flex;align-items:center;gap:10px">
<div class="lang" role="group" aria-label="Language">
<i style="inset-inline-start: {{langX}}"></i>
<button class="{{enOn}}" onClick="{{setEn}}" aria-pressed="{{enPressed}}">EN</button>
<button class="{{arOn}}" onClick="{{setAr}}" aria-pressed="{{arPressed}}">عربي</button>
</div>
<a href="#check" class="btn btn-g" style="min-height:44px"><span class="long">{{t.navCta}}</span><span class="short">{{t.navCtaShort}}</span></a>
</div>
</nav>
</div>

<!-- HERO -->
<header class="hero" id="top">
<div class="kb">
<img class="ph" src="images/ig/DegYWYUm_gs.jpg" alt="{{t.heroAlt}}" style="object-position:50% 62%" fetchpriority="high">
</div>
<div class="hero-shade"></div>
<div class="scroll-i" aria-hidden="true"><span>{{t.scroll}}</span><i></i></div>

<div class="wrap hero-in" style="width:100%">
<div>
<div class="eyebrow track fade-in" style="color:#E7D3A6;animation-delay:.2s">{{t.eyebrow}}</div>
<h1 class="h1 serif">
<span class="ml"><span>{{t.h1a}}</span></span>
<span class="ml"><span>{{t.h1b}}</span></span>
<span class="ml"><span style="font-style:{{italicStyle}};color:#E7D3A6">{{t.h1c}}</span></span>
</h1>
<p class="fade-in" style="max-width:520px;font-size:18px;opacity:.9;margin:28px 0 0;animation-delay:1.1s">{{t.sub}}</p>
</div>

<div class="glass fade-in" id="check" style="padding:28px;animation-delay:1.2s">
<div class="serif" style="font-size:30px;line-height:1.1;font-weight:400">{{t.ckTitle}}</div>
<div class="stack" style="margin-top:20px">
<label class="field track"><span>{{t.ckDate}}</span><input class="inp" type="date" min="{{today}}" value="{{date}}" onChange="{{onDate}}"></label>
<div class="field track"><span>{{t.ckGuests}}</span>
<div class="step"><button aria-label="-10" onClick="{{guestsDec}}">−</button><span style="font-size:20px;letter-spacing:0;text-transform:none">{{guestsFmt}}</span><button aria-label="+10" onClick="{{guestsInc}}">+</button></div></div>
<button class="btn btn-g" onClick="{{check}}" style="width:100%">{{t.ckBtn}}</button>
<sc-if value="{{hasAvail}}" hint-placeholder-val="{{false}}">
<div class="result" role="status">
<div style="display:flex;align-items:center;font-weight:500"><span class="dot" style="background: {{availColor}}"></span>{{availTitle}}</div>
<sc-if value="{{hasNext}}" hint-placeholder-val="{{false}}"><div style="margin-top:6px;opacity:.85">{{t.next}}: <b style="font-weight:600">{{nextDate}}</b></div></sc-if>
<div style="margin-top:8px;font-size:12px;opacity:.7">{{t.ckNote}}</div>
<a class="btn btn-wa" href="{{waUrl}}" target="_blank" rel="noopener" style="margin-top:12px;width:100%;min-height:44px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>{{t.ckWa}}</a>
</div>
</sc-if>
</div>
</div>
</div>

<div class="facts"><div class="wrap facts-in" style="color:#fff">
<div class="fact"><small>{{t.f1l}}</small><b class="serif">{{t.f1v}}</b></div>
<div class="fact"><small>{{t.f2l}}</small><b class="serif">{{t.f2v}}</b></div>
<div class="fact"><small>{{t.f3l}}</small><b class="serif">{{t.f3v}}</b></div>
<div class="fact"><small>{{t.f4l}}</small><b class="serif">{{t.f4v}}</b></div>
</div></div>
</header>

<!-- MOMENTS: KATB KETAB vs RECEPTION + INCLUDED -->
<section class="sec" id="moments">
<div class="wrap">
<div class="rv">
<div class="eyebrow track">{{t.moEyebrow}}</div>
<h2 class="h2 serif">{{t.moTitle}}</h2>
<p class="lead">{{t.moSub}}</p>
</div>
<div class="moments">
<div class="mo day rv">
<img class="ph" src="images/ig/DegY4opG2nA.jpg" alt="{{t.altDay}}" style="object-position:50% 55%" loading="lazy">
<svg class="orn" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="50" cy="50" r="18"/><path d="M50 14v10M50 76v10M14 50h10M76 50h10M24 24l7 7M69 69l7 7M24 76l7-7M69 31l7-7"/></svg>
<div class="when track">{{t.moDayWhen}}</div>
<h3 class="serif">{{t.moDayTitle}}</h3>
<p>{{t.moDaySub}}</p>
<ul><sc-for list="{{dayTags}}" as="x" hint-placeholder-count="4"><li>{{x}}</li></sc-for></ul>
</div>
<div class="mo eve rv">
<img class="ph" src="images/ig/DegX71uGwtq.jpg" alt="{{t.altEve}}" style="object-position:50% 40%" loading="lazy">
<svg class="orn" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M70 60A28 28 0 1 1 40 22a22 22 0 0 0 30 38z"/><circle cx="78" cy="24" r="2"/><circle cx="86" cy="40" r="1.5"/></svg>
<div class="when track" style="color:var(--goldl)">{{t.moEveWhen}}</div>
<h3 class="serif">{{t.moEveTitle}}</h3>
<p>{{t.moEveSub}}</p>
<ul><sc-for list="{{eveTags}}" as="x" hint-placeholder-count="4"><li>{{x}}</li></sc-for></ul>
</div>
</div>
<div class="eyebrow track" style="margin-top:64px">{{t.incEyebrow}}</div>
<div class="inc rv">
<sc-for list="{{incItems}}" as="ic" hint-placeholder-count="8"><div><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.d}}"/></svg><b>{{ic.name}}</b><small>{{ic.desc}}</small></div></sc-for>
</div>
</div>
</section>

<!-- SPACES -->
<section class="sec sp {{nightCls}}" id="spaces">
<div class="wrap">
<div class="rv">
<div class="eyebrow track">{{t.spEyebrow}}</div>
<h2 class="h2 serif">{{t.spTitle}}</h2>
<p class="lead">{{t.spSub}}</p>
</div>

<div style="display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center;margin-top:44px" class="rv">
<div class="tabs" role="tablist">
<i style="width: {{spTabW}}; inset-inline-start: {{spTabX}}"></i>
<sc-for list="{{spaceTabs}}" as="st" hint-placeholder-count="3"><button role="tab" class="{{st.cls}}" aria-selected="{{st.sel}}" onClick="{{st.pick}}">{{st.name}}</button></sc-for>
</div>
<div class="toggle">
<span class="moment track" style="letter-spacing:.14em;text-transform:uppercase">{{t.toggleHint}}</span>
<button class="sw" role="switch" aria-checked="{{nightStr}}" aria-label="{{t.toggleAria}}" onClick="{{flipNight}}">
<span style="inset-inline-start:16px;opacity:{{sunOp}}">{{t.dayShort}}</span>
<span style="inset-inline-end:14px;opacity:{{moonOp}}">{{t.nightShort}}</span>
<i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{modeIcon}}"/></svg></i>
</button>
</div>
</div>

<div class="sp-grid">
<div class="px">
<div class="scene">
<!-- Ceremony Garden: arch aisle (photos) -->
<div class="lay" style="opacity: {{p0d}}"><img class="ph" src="images/ig/DegYOETm8iv.jpg" alt="{{t.alt0d}}" style="object-position:50% 58%" loading="lazy"></div>
<div class="lay" style="opacity: {{p0n}}"><img class="ph" src="images/ig/DegYjkKG2ao.jpg" alt="{{t.alt0n}}" style="object-position:50% 55%" loading="lazy"></div>
<!-- Main Lawn & Kosha Stage (photos) -->
<div class="lay" style="opacity: {{p1d}}"><img class="ph" src="images/ig/DegYdB6m5lh.jpg" alt="{{t.alt1d}}" style="object-position:50% 62%" loading="lazy"></div>
<div class="lay" style="opacity: {{p1n}}"><img class="ph" src="images/ig/DegYzL8G-zA.jpg" alt="{{t.alt1n}}" style="object-position:50% 45%" loading="lazy"></div>
<!-- Bridal Villa -->
<div class="lay" style="opacity: {{sc2}}">
<svg viewBox="0 0 800 560" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<rect width="800" height="560" fill="url(#gSky)"/>
<circle cx="660" cy="220" r="56" fill="#fbe0a0" opacity=".9"/>
<path d="M0 360 Q250 310 500 350 T800 340 V430 H0Z" fill="#b9b784"/>
<rect y="420" width="800" height="140" fill="url(#gLawn)"/>
<rect x="190" y="230" width="420" height="200" fill="#f0e1c6"/>
<polygon points="168,236 400,160 632,236" fill="#b6694a"/>
<rect x="168" y="232" width="464" height="9" fill="#9d5439"/>
<g fill="#e8d6b4" stroke="#c9b27f" stroke-width="2"><path d="M250 330 V280 Q250 252 276 252 Q302 252 302 280 V330Z"/><path d="M374 330 V280 Q374 252 400 252 Q426 252 426 280 V330Z"/><path d="M498 330 V280 Q498 252 524 252 Q550 252 550 280 V330Z"/><path d="M236 420 V372 Q236 350 258 350 Q280 350 280 372 V420Z"/><path d="M520 420 V372 Q520 350 542 350 Q564 350 564 372 V420Z"/></g>
<path d="M365 430 V380 Q365 346 400 346 Q435 346 435 380 V430Z" fill="#7b5a3c" stroke="#c9b27f" stroke-width="2"/>
<rect x="240" y="334" width="320" height="8" fill="#d9c59b"/>
<rect x="330" y="430" width="140" height="10" fill="#e6dcc6"/><rect x="316" y="440" width="168" height="10" fill="#d9ceb4"/>
<g stroke="#4b3a28" stroke-width="7" fill="none" stroke-linecap="round"><path d="M110 460 Q118 340 100 270"/><path d="M700 460 Q690 350 712 280"/></g>
<g fill="#4f6a3a"><ellipse cx="78" cy="262" rx="46" ry="12" transform="rotate(-25 78 262)"/><ellipse cx="124" cy="256" rx="46" ry="12" transform="rotate(20 124 256)"/><ellipse cx="100" cy="240" rx="40" ry="11" transform="rotate(-80 100 240)"/><ellipse cx="690" cy="274" rx="46" ry="12" transform="rotate(-22 690 274)"/><ellipse cx="736" cy="270" rx="46" ry="12" transform="rotate(24 736 270)"/><ellipse cx="712" cy="254" rx="40" ry="11" transform="rotate(-80 712 254)"/></g>
<rect y="470" width="800" height="14" fill="#5d6b3c" opacity=".6"/>
</svg>
</div>
<div class="nightov" style="opacity: {{nightOv}}"></div>
<!-- night lights, per space -->
<div class="lay" style="opacity: {{lt2}}">
<svg viewBox="0 0 800 560" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<g fill="#fff"><circle class="tw" cx="70" cy="50" r="1.6"/><circle class="tw" cx="220" cy="100" r="1.4"/><circle class="tw" cx="380" cy="40" r="1.8"/><circle class="tw" cx="540" cy="90" r="1.4"/><circle class="tw" cx="700" cy="60" r="1.6"/></g>
<g fill="#ffcf7a"><path d="M250 330 V280 Q250 252 276 252 Q302 252 302 280 V330Z"/><path d="M374 330 V280 Q374 252 400 252 Q426 252 426 280 V330Z"/><path d="M498 330 V280 Q498 252 524 252 Q550 252 550 280 V330Z"/><path d="M236 420 V372 Q236 350 258 350 Q280 350 280 372 V420Z"/><path d="M520 420 V372 Q520 350 542 350 Q564 350 564 372 V420Z"/></g>
<g><circle cx="276" cy="290" r="60" fill="url(#gGlow)"/><circle cx="400" cy="290" r="60" fill="url(#gGlow)"/><circle cx="524" cy="290" r="60" fill="url(#gGlow)"/><circle cx="258" cy="385" r="50" fill="url(#gGlow)"/><circle cx="542" cy="385" r="50" fill="url(#gGlow)"/></g>
<g fill="#ffe2a0"><circle cx="340" cy="392" r="5"/><circle cx="460" cy="392" r="5"/></g>
<g><circle cx="340" cy="392" r="26" fill="url(#gGlow)"/><circle cx="460" cy="392" r="26" fill="url(#gGlow)"/></g>
<path d="M60 300 Q400 380 740 300" fill="none" stroke="#5a4a2c" stroke-width="1.5"/>
<g fill="#ffe2a0"><circle cx="150" cy="332" r="4"/><circle cx="250" cy="352" r="4"/><circle cx="350" cy="364" r="4"/><circle cx="450" cy="364" r="4"/><circle cx="550" cy="352" r="4"/><circle cx="650" cy="332" r="4"/></g>
</svg>
</div>
</div>
<div style="display:flex;gap:12px;align-items:center;margin-top:16px;font-size:13px;opacity:.75">
<span style="width:8px;height:8px;border-radius:50%;background:var(--gold)"></span>{{sceneNoteTxt}}
</div>
</div>

<div>
<div style="font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.75" class="track">{{modeLabel}}</div>
<h3 class="serif" style="font-size:clamp(34px,4vw,52px);line-height:1.08;font-weight:300;margin:10px 0 0">{{curSpace.name}}</h3>
<p style="font-size:17px;opacity:.85;margin:16px 0 0;min-height:112px">{{curSpace.desc}}</p>
<div class="specs">
<div><small>{{t.spSeated}}</small><b class="serif">{{curSpace.cap}}</b></div>
<div><small>{{t.spArea}}</small><b class="serif">{{curSpace.area}}</b></div>
<div><small>{{t.spMode}}</small><b class="serif" style="font-size:24px;padding-top:12px">{{modeShort}}</b></div>
</div>
<div class="eyebrow track" style="margin-top:28px">{{t.spInc}}</div>
<ul class="amen">
<sc-for list="{{curSpace.amen}}" as="a" hint-placeholder-count="4"><li><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.d}}"/></svg>{{a.label}}</li></sc-for>
</ul>
<a href="#tour" class="btn btn-o" style="margin-top:30px">{{t.spCta}}</a>
</div>
</div>
</div>
</section>

<!-- PACKAGES -->
<section class="sec" id="packages" style="background:var(--sand)">
<div class="wrap">
<div class="rv">
<div class="eyebrow track">{{t.pkEyebrow}}</div>
<h2 class="h2 serif">{{t.pkTitle}}</h2>
<p class="lead">{{t.pkSub}}</p>
</div>

<div class="tiers">
<sc-for list="{{tierCards}}" as="c" hint-placeholder-count="3">
<div class="tier rv {{c.cls}}">
<sc-if value="{{c.best}}" hint-placeholder-val="{{false}}"><span class="badge track">{{t.pkBest}}</span></sc-if>
<div class="serif" style="font-size:32px;font-weight:400">{{c.name}}</div>
<div style="margin-top:20px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><span class="price serif">{{c.price}}</span><span style="font-size:13px;opacity:.75">{{t.egp}} · {{t.perGuest}}</span></div>
<span class="minp"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8"/></svg>{{c.min}}</span>
<ul class="tlist">
<sc-for list="{{c.features}}" as="f" hint-placeholder-count="4"><li><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>{{f}}</span></li></sc-for>
</ul>
<button class="btn {{c.btn}}" onClick="{{c.pick}}">{{c.btnLabel}}</button>
</div>
</sc-for>
</div>
<p style="font-size:13px;opacity:.7;margin:20px 0 0">{{t.pkNote}}</p>

<!-- SIMULATOR -->
<div class="sim" id="budget">
<div class="panel rv">
<div class="eyebrow track">{{t.simEyebrow}}</div>
<h3 class="serif" style="font-size:clamp(32px,3.6vw,44px);font-weight:300;line-height:1.1;margin:10px 0 28px">{{t.simTitle}}</h3>

<div class="ctl">
<label for="g"><span>{{t.simGuests}}</span><span class="bignum serif">{{guestsFmt}}</span></label>
<input id="g" class="range" type="range" min="100" max="700" step="10" value="{{guests}}" onChange="{{onGuests}}" style="--p: {{guestPct}}">
<div style="display:flex;justify-content:space-between;font-size:12px;opacity:.65"><span>{{minLabel}}</span><span>{{maxLabel}}</span></div>
</div>

/* Tiny template runtime: {{holes}}, <sc-if>, <sc-for>, on* handlers, DOM morphing. */
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; this._q = false; }
  setState(p) {
    const o = typeof p === 'function' ? p(this.state) : p;

  function bind(el) {
    el.__reg = el.__reg || {};

    if (node.nodeType !== 1) return;

      if (val(node.getAttribute('value'), sc)) node.childNodes.forEach((c) => build(c, sc, out));
      return;
    }

  function patch(o, n, parent) {
    if (o.nodeType !== n.nodeType || o.nodeName !== n.nodeName) { parent.replaceChild(n, o); return; }
